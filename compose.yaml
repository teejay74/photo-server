services:
  photo-gallery:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PHOTO_HOST: 0.0.0.0
      PHOTO_PORT: 8080
      PHOTO_ROOT: /photos
      PHOTO_CACHE: /app/.cache
      PHOTO_DB: /app/data/gallery.db
      PHOTO_BACKUP_DIR: /app/backups
      PHOTO_BACKUP_INTERVAL: ${PHOTO_BACKUP_INTERVAL:-24}
      PHOTO_BACKUP_RETENTION: ${PHOTO_BACKUP_RETENTION:-7}
      PHOTO_SCAN_INTERVAL: ${PHOTO_SCAN_INTERVAL:-300}
      PHOTO_USER: ${PHOTO_USER:-photos}
      PHOTO_PASSWORD: ${PHOTO_PASSWORD:?Set PHOTO_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${PHOTO_DIR:-/srv/photos/xiaomi-13t/Camera}
        target: /photos
        read_only: true
      - thumbnail-cache:/app/.cache
      - gallery-data:/app/data
      - gallery-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  thumbnail-cache:
  gallery-data:
  gallery-backups:
